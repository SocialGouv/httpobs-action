name: "tests"
on:
  pull_request:
  push:
    branches:
      - master
      - "releases/*"

jobs:
  # test action works running from the graph
  test:
    name: Test GH Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Run on www.free.fr
        uses: ./
        with:
          url: https://www.free.fr
          output: something.json
      - run: |
          cat something.json | jq ".scan.grade"
