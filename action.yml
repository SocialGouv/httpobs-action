name: "Run Mozilla HTTP Observatory scan"
description: "Run a scan on https://observatory.mozilla.org API"
inputs:
  url:
    description: "URL ro scan"
    required: true
  output:
    description: "Path to output file. defaults to httpobs.json"
    default: "httpobs.json"
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set +e

        remove_url_prefix() {
            local url="$1"
            url="${url#http://}"
            url="${url#https://}"
            echo "$url"
        }

        HOST=$(remove_url_prefix "$INPUT_URL")

        echo "testing HOST $HOST"

        export RETRIEVER_USER_AGENT="Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:129.0) Gecko/20100101 Firefox/129.0 Observatory/129.0 dashlord",

        npx @mdn/mdn-http-observatory $HOST > "$INPUT_OUTPUT"

        cat "$INPUT_OUTPUT" | jq ".scan.grade"
